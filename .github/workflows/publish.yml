name: Publish Package to npm

on:
  push:
    tags:
      - "v*"
  # Republish an existing tag after the workflow changes. Tag pushes use the
  # workflow committed on that tag, so a fix on main does not rerun v0.13.0.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.13.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  YARN_ENABLE_HARDENED_MODE: "1"
  YARN_ENABLE_SCRIPTS: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node
        # v7.1.0 — skip cache: yarn; setup-node would invoke Yarn 1
        # before Corepack can activate Yarn 4 from packageManager.
        # No registry-url: that writes an npm token placeholder, and a
        # token that still requires an OTP is what made publish fail with EOTP.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run checks
        run: yarn check

      - name: Verify release tag and package contents
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          npm pack --dry-run

      - name: Publish to npm
        run: |
          npm install -g npm@11.21.2
          if [ -f "$HOME/.npmrc" ]; then
            grep -v '_authToken' "$HOME/.npmrc" > "$HOME/.npmrc.stripped" || true
            mv "$HOME/.npmrc.stripped" "$HOME/.npmrc"
          fi
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --access public --provenance
